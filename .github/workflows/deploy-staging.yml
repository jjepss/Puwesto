name: Deploy staging

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install clasp
        run: npm install -g @google/clasp@3

      - name: Restore clasp login
        env:
          CLASPRC: ${{ secrets.STAGING_CLASPRC_JSON }}
        run: echo "$CLASPRC" > ~/.clasprc.json

      - name: Point clasp at Puwesto Staging
        env:
          SCRIPT_ID: ${{ secrets.STAGING_SCRIPT_ID }}
        run: echo "{\"scriptId\":\"$SCRIPT_ID\",\"rootDir\":\"src\"}" > .clasp.json

      - name: Push the code
        run: clasp push --force

      - name: Update the staging deployment
        env:
          DEPLOYMENT_ID: ${{ secrets.STAGING_DEPLOYMENT_ID }}
        run: clasp update-deployment "$DEPLOYMENT_ID" -d "Staging ${GITHUB_SHA::7}"