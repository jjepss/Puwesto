name: Deploy production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install clasp
        run: npm install -g @google/clasp@3

      - name: Restore clasp login
        env:
          CLASPRC: ${{ secrets.PROD_CLASPRC_JSON }}
        run: echo "$CLASPRC" > ~/.clasprc.json

      - name: Point clasp at Puwesto (production)
        env:
          SCRIPT_ID: ${{ secrets.PROD_SCRIPT_ID }}
        run: echo "{\"scriptId\":\"$SCRIPT_ID\",\"rootDir\":\"src\"}" > .clasp.json

      - name: Limit access to the client org
        run: |
          jq '.webapp.access = "DOMAIN"' src/appsscript.json > appsscript.tmp
          mv appsscript.tmp src/appsscript.json

      - name: Push the code
        run: clasp push --force

      - name: Update the production deployment
        env:
          DEPLOYMENT_ID: ${{ secrets.PROD_DEPLOYMENT_ID }}
        run: clasp update-deployment "$DEPLOYMENT_ID" -d "Production ${GITHUB_SHA::7}"